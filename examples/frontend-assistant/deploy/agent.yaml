apiVersion: a8s/v1
kind: AgentDeployment
name: frontend-assistant
agentImage: registry.example.com/a8s:dev
runtimeClassRef: codex-node
workingDir: /runtime
resources:
  cpu: "1"
  memory: 1Gi
update:
  strategy: restart
idleReclaim:
  # Keep running while MCP services, background work, or unknown activity remain.
  enabled: true
  idleTimeout: 10m
  checkInterval: 1m
