syntax = "proto3";
package a8s.execution.v1;
import "a8s/agentc/v1/agentc.proto";
option go_package = "github.com/jingyugao/a8s/execution/gen/a8s/execution/v1;executionv1";

message Resource { string scope = 1; string deployment_id = 2; string workspace_id = 3; string thread_id = 4; }
message Record {
  string request_id = 1;
  string state = 2;
  string thread_id = 3;
  string turn_id = 4;
}
message OpenThreadRequest { Resource resource = 1; string request_key = 2; }
message OpenThreadResponse { Record record = 1; }
message ThreadSummary { string thread_id = 1; string created_at = 2; }
message ListThreadsRequest { Resource resource = 1; uint32 page_size = 2; string page_token = 3; }
message ListThreadsResponse { repeated ThreadSummary threads = 1; string next_page_token = 2; }
message ReadThreadRequest { Resource resource = 1; string before_turn_id = 2; uint32 page_size = 3; }
message ReadThreadResponse { repeated a8s.agentc.v1.ThreadMessage messages = 1; string next_before_turn_id = 2; }
message SubmitInputRequest { Resource resource = 1; string request_key = 2; string text = 3; string author_id = 4; }
message SubmitInputResponse { Record record = 1; }
message GetInputResultRequest { Resource resource = 1; string request_id = 2; }
message GetInputResultResponse { a8s.agentc.v1.InputResult result = 1; }
message CancelRequest { Resource resource = 1; string request_key = 2; string input_request_id = 3; string turn_id = 4; }
message CancelResponse { Record record = 1; }
message RespondInteractionRequest { Resource resource = 1; string request_key = 2; string input_request_id = 3; string turn_id = 4; string interaction_id = 5; string decision = 6; }
message RespondInteractionResponse { Record record = 1; }
message SubscribeRequest { Resource resource = 1; string input_request_id = 2; }
message SubscribeResponse { a8s.agentc.v1.SubscribeResponse event = 1; }
message LookupRequest { Resource resource = 1; string kind = 2; string request_key = 3; }
message LookupResponse { Record record = 1; }
service ExecutionService {
  rpc OpenThread(OpenThreadRequest) returns (OpenThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc ReadThread(ReadThreadRequest) returns (ReadThreadResponse);
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);
  rpc GetInputResult(GetInputResultRequest) returns (GetInputResultResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc RespondInteraction(RespondInteractionRequest) returns (RespondInteractionResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
}
