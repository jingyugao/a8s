# Platform-internal template. Agent authors only submit their agent.yaml.
# Variables are provided by scripts/agent.py, never copied from an operator's Codex installation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${A8S_EXAMPLE_PREFIX}-a8s-server
    namespace: ${A8S_EXAMPLE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
subjects:
  - kind: ServiceAccount
    name: ${A8S_EXAMPLE_PREFIX}-a8s-server
    namespace: ${A8S_EXAMPLE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-workspace
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${A8S_EXAMPLE_STORAGE_CLASS}
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
  template:
    metadata:
      labels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
    spec:
      serviceAccountName: ${A8S_EXAMPLE_PREFIX}-a8s-server
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      containers:
        - name: server
          image: ${A8S_IMAGE_REFERENCE}
          command: [/usr/local/bin/a8s-server]
          args: [--listen=0.0.0.0:8090]
          envFrom: [{secretRef: {name: a8s-server}}]
          env:
            - {name: A8S_TENANT, value: "${A8S_TENANT}"}
            - {name: A8S_PROJECT, value: "${A8S_PROJECT}"}
            - {name: A8S_KUBERNETES_NAMESPACE, value: "${A8S_EXAMPLE_NAMESPACE}"}
            - {name: A8S_WORKSPACE_DIRECTORY, value: /home/agent}
            - name: A8S_AGENTC_URL
              value: http://{instance}.${A8S_EXAMPLE_NAMESPACE}.svc:8094
            - {name: A8S_REGISTRY_PLAIN_HTTP, value: "${A8S_EXAMPLE_PLAIN_HTTP}"}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  selector: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
  ports: [{name: http, port: 8090, targetPort: http}]
