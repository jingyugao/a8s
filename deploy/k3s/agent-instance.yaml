# Platform-internal template. Agent authors only submit their agent.yaml.
# Variables are provided by scripts/agent.py, never copied from an operator's Codex installation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${A8S_EXAMPLE_PREFIX}-a8s-server
    namespace: ${A8S_EXAMPLE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
subjects:
  - kind: ServiceAccount
    name: ${A8S_EXAMPLE_PREFIX}-a8s-server
    namespace: ${A8S_EXAMPLE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${A8S_EXAMPLE_NAMESPACE}-${A8S_EXAMPLE_PREFIX}-node-observer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-workspace
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${A8S_EXAMPLE_STORAGE_CLASS}
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-agentc
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  clusterIP: None
  selector: {app: "${A8S_EXAMPLE_PREFIX}-a8s-agentc"}
  ports: [{name: agentc, port: 8094}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-agentc
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  serviceName: ${A8S_EXAMPLE_PREFIX}-a8s-agentc
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-agentc"}
  template:
    metadata:
      labels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-agentc"}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      containers:
        - name: agentc
          image: ${A8S_IMAGE_REFERENCE}
          command: [/usr/local/bin/a8s-codex-agentc]
          args:
            - --listen=0.0.0.0:8094
            - --host=/usr/local/bin/codex
            - --runtime-dir=/var/lib/a8s/instance
            - --package-layout=/opt/a8s/package
            - --pass-env=PATH,HOME,LANG,TZ,AGENT_ROOT,COLONY_MODEL_API_KEY
          envFrom: [{secretRef: {name: a8s-model}}]
          ports: [{name: agentc, containerPort: 8094}]
          readinessProbe:
            tcpSocket: {port: agentc}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: native-state, mountPath: /var/lib/a8s}
            - {name: host-config, mountPath: /etc/codex, readOnly: true}
      volumes:
        - name: host-config
          configMap: {name: a8s-host-config}
  volumeClaimTemplates:
    - metadata: {name: native-state}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ${A8S_EXAMPLE_STORAGE_CLASS}
        resources:
          requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
  template:
    metadata:
      labels: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
    spec:
      serviceAccountName: ${A8S_EXAMPLE_PREFIX}-a8s-server
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      containers:
        - name: server
          image: ${A8S_IMAGE_REFERENCE}
          command: [/usr/local/bin/a8s-server]
          args: [--listen=0.0.0.0:8090]
          envFrom: [{secretRef: {name: a8s-server}}]
          env:
            - {name: A8S_TENANT, value: "${A8S_TENANT}"}
            - {name: A8S_PROJECT, value: "${A8S_PROJECT}"}
            - {name: A8S_KUBERNETES_NAMESPACE, value: "${A8S_EXAMPLE_NAMESPACE}"}
            - {name: A8S_WORKSPACE_DIRECTORY, value: /home/agent}
            - name: A8S_AGENTC_URL
              value: http://${A8S_EXAMPLE_PREFIX}-a8s-agentc-0.${A8S_EXAMPLE_PREFIX}-a8s-agentc.${A8S_EXAMPLE_NAMESPACE}.svc:8094
            - {name: A8S_REGISTRY_PLAIN_HTTP, value: "${A8S_EXAMPLE_PLAIN_HTTP}"}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ${A8S_EXAMPLE_PREFIX}-a8s-server
  namespace: ${A8S_EXAMPLE_NAMESPACE}
spec:
  selector: {app: "${A8S_EXAMPLE_PREFIX}-a8s-server"}
  ports: [{name: http, port: 8090, targetPort: http}]
